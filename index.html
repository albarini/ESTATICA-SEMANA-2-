<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cuestionario Interactivo de Estática - Lectura 2</title>
<style>
body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; padding: 20px; }
.question { font-size: 1.2rem; margin-bottom: 10px; }
.quiz-form { display: grid; gap: 12px; margin-bottom: 20px; }
label.answer { background: rgba(31,41,55,0.9); padding: 12px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
label.answer input { transform: scale(1.2); margin-right: 8px; accent-color: #38bdf8; }
label.correct { background: rgba(34,197,94,0.3); border: 1px solid #22c55e; }
label.incorrect { background: rgba(239,68,68,0.3); border: 1px solid #ef4444; }
#timer { font-size: 1.2rem; margin-bottom: 20px; }
#formulaBox { margin: 16px 0; padding: 16px; border-radius: 10px; background: rgba(14,116,144,0.12); display: none; }
.formula-grid { display: grid; gap: 10px; }
.formula { background: rgba(15,23,42,0.7); padding: 8px; border-radius: 8px; font-family: monospace; }
#result { margin-top: 20px; font-size: 1.2rem; }
</style>
</head>
<body>

<h2>Cuestionario Interactivo de Estática - Lectura 2</h2>
<p>Ejercicios aplicativos de R2 y R3: vectores, fuerzas, momentos, reacciones y cargas distribuidas.</p>

<div id="timer">Tiempo: 50 s</div>
<div id="formulaBox"></div>
<div id="question" class="question"></div>
<form id="answers" class="quiz-form" autocomplete="off"></form>

<div id="result"></div>

<script>
// Aquí van las 40 preguntas formateadas de la Lectura 2
const questions = [
    // Ejemplo de pregunta, reemplaza con tus 40 preguntas
    {
        "tema":"Vectores en R2",
        "dif":"Básica aplicada",
        "q":"Una fuerza de 50 N forma 60° con el eje +x. ¿Cuáles son sus componentes?",
        "opts":["Fx=25 N, Fy=43.3 N","Fx=43.3 N, Fy=25 N","Fx=50 N, Fy=60 N","Fx=30 N, Fy=40 N"],
        "ans":0,
        "exp":"Fx = F cos60° = 25 N, Fy = F sen60° = 43.3 N."
    },
    {
        "tema":"Vectores en R2",
        "dif":"Básica aplicada",
        "q":"Una fuerza F = 40i + 30j N. ¿Cuál es su magnitud?",
        "opts":["50 N","70 N","10 N","100 N"],
        "ans":0,
        "exp":"|F| = √(40² + 30²) = 50 N."
    },
    // Inserta aquí las otras 38 preguntas de Lectura 2
];

// Fórmulas por tema
const formulaByTopic = {
    "Vectores en R2":[["Fx = F cosθ","Componente horizontal."],["Fy = F senθ","Componente vertical."],["F = √(Fx² + Fy²)","Magnitud en R2."]],
    "Vectores en R3":[["F = Fxi + Fyj + Fzk","Forma cartesiana."],["|F| = √(Fx² + Fy² + Fz²)","Magnitud R3."],["F = |F| u","Fuerza desde magnitud y dirección."]],
    "Equilibrio de partícula en R3":[["ΣFx=0","Equilibrio x."],["ΣFy=0","Equilibrio y."],["ΣFz=0","Equilibrio z."]],
    "Momento en R3":[["M = r × F","Momento vectorial."],["M = (yFz-zFy)i - (xFz-zFx)j + (xFy-yFx)k","Expansión cruz."]],
    "Momento respecto a eje":[["M_eje = u · (r × F)","Momento sobre eje."]],
    "Reacciones en apoyos R3":[["Rótula: Ax, Ay, Az","Tres fuerzas, sin momento."],["Empotramiento: Ax, Ay, Az, Mx, My, Mz","Seis incógnitas."]],
    "Formulario estático R3":[["ΣFx=ΣFy=ΣFz=0","Fuerzas en equilibrio."],["ΣMx=ΣMy=ΣMz=0","Momentos en equilibrio."]]
};

let current=0;
let score=0;
let timer=50;
let interval=null;

const $ = id => document.getElementById(id);

function startTimer() {
    timer=50;
    $("timer").textContent = "Tiempo: "+timer+" s";
    interval = setInterval(()=>{
        timer--;
        $("timer").textContent = "Tiempo: "+timer+" s";
        if(timer<=0) { clearInterval(interval); selectAnswer(null); }
    },1000);
}

function renderFormulaBox(topic) {
    const box = $("formulaBox");
    const formulas = formulaByTopic[topic] || [];
    if(formulas.length==0){box.style.display="none"; box.innerHTML=""; return;}
    box.style.display="block";
    box.innerHTML = `<h3>Fórmulas útiles para esta pregunta</h3><div class="formula-grid">`+
        formulas.map(f=>`<div class="formula"><code>${f[0]}</code><small>${f[1]}</small></div>`).join('')+
        `</div>`;
}

function showQuestion() {
    if(current>=questions.length){showResult(); return;}
    const q = questions[current];
    $("question").textContent = q.q;
    renderFormulaBox(q.tema);
    const answers = $("answers");
    answers.innerHTML = "";
    q.opts.forEach((opt,idx)=>{
        const label = document.createElement("label");
        label.className="answer";
        label.innerHTML = `<input type="radio" name="q${current}" value="${idx}"> ${opt}`;
        label.onclick = ()=>selectAnswer(idx);
        answers.appendChild(label);
    });
    startTimer();
}

function selectAnswer(idx) {
    clearInterval(interval);
    const q = questions[current];
    const labels = document.querySelectorAll("#answers label");
    labels.forEach((label,i)=>{
        label.querySelector("input").disabled=true;
        if(i===q.ans) label.classList.add("correct");
        if(idx!==null && i===idx && idx!==q.ans) label.classList.add("incorrect");
    });
    if(idx===q.ans) score+=0.5;
    if(idx!==null) alert("Explicación: "+q.exp);
    current++;
    setTimeout(showQuestion,500);
}

function showResult() {
    $("question").style.display="none";
    $("answers").style.display="none";
    $("timer").style.display="none";
    $("formulaBox").style.display="none";
    $("result").innerHTML=`<h3>Nota final: ${score}/20</h3>`+
        `<p>Respondiste correctamente ${score/0.5} de ${questions.length} preguntas.</p>`+
        `<p>Revisa los temas donde fallaste y practica R2 y R3.</p>`;
}

showQuestion();
</script>

</body>
</html>
